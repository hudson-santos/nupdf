name: versao

# Dispara ao subir um commit cuja mensagem comece com "Versão - [X.Y.Z]"
# (ex.: "Versão - [1.23.1]"; até a 1.23.0 era "release - [X.Y.Z]") - cria a
# tag e a Release do GitHub dessa versão (nome da Release = só "X.Y.Z"),
# com a descrição copiada direto do CHANGELOG.md (a mesma fonte
# única já usada em todo o resto do projeto - nada aqui fica hardcoded
# por versão).
#
# O Instalador.exe NÃO é compilado aqui: é gerado localmente e publicado no
# Cloudflare R2 pelo instalador\publicar.ps1 ANTES do push
# (https://arquivos.nukt.com.br/atualizacoes/nupdf/). Este workflow só baixa de lá
# o Instalador-X.Y.Z.exe, confere o SHA-256 com o versao.json publicado e o anexa
# à Release - é por esse anexo que os NuPDF até a 1.25.2 (que procuram atualização
# no GitHub) recebem a versão nova, que já passa a usar o R2.
"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Versão - [')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5  # Node 24

      - name: Extrair a versão da mensagem do commit
        id: versao
        shell: bash
        env:
          MENSAGEM_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ ! "$MENSAGEM_COMMIT" =~ ^Versão\ -\ \[([^]]+)\] ]]; then
            echo "Mensagem de commit não bate com 'Versão - [X.Y.Z]': $MENSAGEM_COMMIT"
            exit 1
          fi
          VERSAO="${BASH_REMATCH[1]}"
          echo "Versão extraída: $VERSAO"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

      - name: Extrair título e descrição do CHANGELOG.md
        id: changelog
        shell: bash
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -euo pipefail

          TITULO="$(grep -m1 -F "## [$VERSAO] - " CHANGELOG.md || true)"
          if [ -z "$TITULO" ]; then
            echo "Não encontrei a seção '## [$VERSAO] - ...' em CHANGELOG.md"
            exit 1
          fi
          TITULO="${TITULO#\#\# }"
          echo "Título da release: $TITULO"
          echo "titulo=$TITULO" >> "$GITHUB_OUTPUT"

          # Corpo = tudo entre o título desta versão (exclusive) e o
          # próximo "## [" (exclusive) ou o fim do arquivo - usa índice
          # de substring (não regex) pra não precisar escapar nada da
          # versão em si.
          awk -v marca="## [$VERSAO] - " '
            $0 ~ /^## \[/ && index($0, marca) == 1 { capturando=1; next }
            capturando && /^## \[/ { exit }
            capturando { print }
          ' CHANGELOG.md > corpo_release.md

          # Remove linhas em branco só do início (o CHANGELOG sempre tem
          # uma linha em branco logo após o título de cada versão).
          sed -i -e '/./,$!d' corpo_release.md

          # Junta as linhas de continuação (indentadas) ao item de cima: no
          # CHANGELOG os itens quebram em ~95 colunas para leitura, mas a
          # página de Releases do GitHub trata cada quebra de linha como
          # quebra real. Sub-itens ("  - ...") continuam em linha própria.
          awk '
            /^[[:space:]]+[^[:space:]]/ && $0 !~ /^[[:space:]]*[-*][[:space:]]/ && tem && ant != "" {
              sub(/^[[:space:]]+/, ""); ant = ant " " $0; next
            }
            { if (tem) print ant; ant = $0; tem = 1 }
            END { if (tem) print ant }
          ' corpo_release.md > corpo_unido.md
          mv corpo_unido.md corpo_release.md

          if [ ! -s corpo_release.md ]; then
            echo "Seção do CHANGELOG para $VERSAO ficou vazia."
            exit 1
          fi

          {
            echo "corpo<<CHANGELOG_EOF"
            cat corpo_release.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Baixar o Instalador.exe publicado no R2
        shell: bash
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -euo pipefail
          BASE="https://arquivos.nukt.com.br/atualizacoes/nupdf"
          curl -fsSL --retry 5 --retry-all-errors "$BASE/versao.json?t=$(date +%s)" -o versao.json
          PUBLICADA="$(jq -r .versao versao.json)"
          if [ "$PUBLICADA" != "$VERSAO" ]; then
            echo "::error::O versao.json do R2 está na versão $PUBLICADA, não na $VERSAO. Rode instalador\\publicar.ps1 antes do push."
            exit 1
          fi
          curl -fsSL --retry 5 --retry-all-errors "$(jq -r .url versao.json)" -o Instalador.exe
          ESPERADO="$(jq -r .sha256 versao.json)"
          OBTIDO="$(sha256sum Instalador.exe | cut -d' ' -f1)"
          if [ "$OBTIDO" != "$ESPERADO" ]; then
            echo "::error::SHA-256 do instalador baixado ($OBTIDO) não confere com o versao.json ($ESPERADO)."
            exit 1
          fi
          echo "Instalador $VERSAO conferido: $OBTIDO"

      - name: Criar a tag e a Release no GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ steps.versao.outputs.versao }}
          CORPO: ${{ steps.changelog.outputs.corpo }}
        run: |
          set -euo pipefail
          printf '%s' "$CORPO" > corpo_release.md
          gh release create "$VERSAO" \
            --title "$VERSAO" \
            --notes-file corpo_release.md \
            --target "${{ github.sha }}" \
            "Instalador.exe"
